<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Learning instances from their own views</title>
<desc id="desc">Two transformed views of the same phone feed VINIL. A loop represents continued self-supervised updating and a sequence of instance symbols represents learning over time. This is not a replay-buffer diagram.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#514b40" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="500" fill="#eee8dc"/>
<g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><rect x="62" y="145" width="118" height="100" rx="10" fill="#f8f5ed" stroke="#514b40" /><g transform="translate(121 196) rotate(-10)"><rect x="-22" y="-38" width="44" height="76" rx="8" fill="#f8f5ed" stroke="#514b40" /><rect x="-15" y="-28" width="30" height="38" rx="3" fill="#eee8dc" stroke="#514b40" /><path d="M-7 20 L7 20" stroke="#514b40"/><circle cx="0" cy="30" r="2" fill="#514b40" stroke="none"/></g><rect x="62" y="267" width="118" height="100" rx="10" fill="#dce0d4" stroke="#7b8873" /><g transform="translate(121 318) rotate(12)"><rect x="-22" y="-38" width="44" height="76" rx="8" fill="#dce0d4" stroke="#514b40" /><rect x="-15" y="-28" width="30" height="38" rx="3" fill="#eee8dc" stroke="#514b40" /><path d="M-7 20 L7 20" stroke="#514b40"/><circle cx="0" cy="30" r="2" fill="#514b40" stroke="none"/></g><path d="M198 195 C248 195 245 250 285 250" stroke="#514b40" fill="none" /><path d="M198 317 C248 317 245 250 285 250" stroke="#514b40" fill="none" /><rect x="300" y="193" width="184" height="114" rx="12" fill="#f8f5ed" stroke="#514b40" /><text x="392" y="259" fill="#514b40" stroke="none" font-size="30" text-anchor="middle">VINIL</text><path d="M505 250 L555 250" stroke="#514b40" marker-end="url(#arrow)"/><path d="M571 250 L737 250" stroke="#bdb3a1"/><circle cx="592" cy="250" r="19" fill="#dfc5b5" stroke="#514b40"/><circle cx="648" cy="250" r="19" fill="#dce0d4" stroke="#514b40"/><circle cx="704" cy="250" r="19" fill="#f8f5ed" stroke="#514b40"/><path d="M335 171 C335 119 451 119 451 171" stroke="#7b8873" fill="none" marker-end="url(#arrow)"/><text x="121" y="421" fill="#655f55" stroke="none" font-size="28" text-anchor="middle">Two views</text><text x="392" y="421" fill="#655f55" stroke="none" font-size="28" text-anchor="middle">Self-supervision</text><text x="651" y="421" fill="#655f55" stroke="none" font-size="28" text-anchor="middle">Keep learning</text></g>
</svg>
