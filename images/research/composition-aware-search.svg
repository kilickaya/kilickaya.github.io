<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Keeping visual relationships in a representation</title>
<desc id="desc">Two visual queries contain the same abstract person and object tokens but different spatial relationships. Corresponding representations below are linked to emphasize structure-preserving learning. This is a conceptual account of composition-aware visual search.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#514b40" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="500" fill="#eee8dc"/>
<g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><rect x="71" y="102" width="212" height="185" rx="10" fill="#f8f5ed" stroke="#514b40" /><rect x="155" y="127" width="40" height="69" rx="5" fill="#dfc5b5" stroke="#ad7056" /><rect x="116" y="199" width="120" height="48" rx="5" fill="#dce0d4" stroke="#7b8873" /><path d="M175 184 L175 207" stroke="#514b40" fill="none" /><path d="M177 304 L177 350" stroke="#514b40" marker-end="url(#arrow)"/><rect x="129" y="369" width="96" height="53" rx="6" fill="#f8f5ed" stroke="#514b40" /><circle cx="153" cy="385" r="5" fill="#ad7056" stroke="none"/><circle cx="177" cy="396" r="5" fill="#7b8873" stroke="none"/><circle cx="201" cy="407" r="5" fill="#514b40" stroke="none"/><rect x="515" y="102" width="212" height="185" rx="10" fill="#f8f5ed" stroke="#514b40" /><rect x="541" y="165" width="40" height="69" rx="5" fill="#dfc5b5" stroke="#ad7056" /><rect x="606" y="165" width="96" height="48" rx="5" fill="#dce0d4" stroke="#7b8873" /><path d="M582 189 L609 189" stroke="#514b40" fill="none" /><path d="M621 304 L621 350" stroke="#514b40" marker-end="url(#arrow)"/><rect x="573" y="369" width="96" height="53" rx="6" fill="#f8f5ed" stroke="#514b40" /><circle cx="597" cy="407" r="5" fill="#ad7056" stroke="none"/><circle cx="621" cy="396" r="5" fill="#7b8873" stroke="none"/><circle cx="645" cy="385" r="5" fill="#514b40" stroke="none"/><path d="M310 194 L488 194" stroke="#514b40" marker-end="url(#arrow)"/><text x="400" y="154" fill="#655f55" stroke="none" font-size="26" text-anchor="middle">Recompose</text><path d="M310 396 L488 396" stroke="#514b40" marker-end="url(#arrow)"/><text x="400" y="444" fill="#655f55" stroke="none" font-size="26" text-anchor="middle">Change together</text><text x="177" y="66" fill="#655f55" stroke="none" font-size="26" text-anchor="middle">Visual query</text><text x="621" y="66" fill="#655f55" stroke="none" font-size="26" text-anchor="middle">New relation</text></g>
</svg>
