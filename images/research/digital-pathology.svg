<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">From whole-slide tissue images to recurrence risk</title>
<desc id="desc">A conceptual whole-slide tissue image is passed into a neural network that outputs a recurrence risk score. The marker is illustrative and gives no numerical or clinical prediction.</desc>
