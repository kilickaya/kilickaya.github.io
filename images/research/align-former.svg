<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Finding interactions from image-level supervision</title>
<desc id="desc">A simple scene and an image-level interaction label feed an alignment step. The output localizes a person and an object and connects their interaction. No region-pair annotations are depicted as inputs.</desc>
