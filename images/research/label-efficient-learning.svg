<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Three paths to label-efficient incremental learning</title>
<desc id="desc">Semi-supervised, few-shot and self-supervised learning are shown as three conceptual paths through past, present and future data. Filled dots indicate labels; paired arcs indicate self-supervised views. The diagram makes no numerical comparison.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#514b40" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="500" fill="#eee8dc"/>
<g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><text x="52" y="150" fill="#655f55" stroke="none" font-size="25" text-anchor="start">Semi-supervised</text><path d="M294 142 L748 142" stroke="#bdb3a1" marker-end="url(#arrow)"/><circle cx="346" cy="142" r="27" fill="#f8f5ed" stroke="#514b40"/><circle cx="339" cy="142" r="5" fill="#ad7056" stroke="none"/><circle cx="353" cy="142" r="5" fill="#f8f5ed" stroke="#514b40"/><circle cx="502" cy="142" r="27" fill="#f8f5ed" stroke="#514b40"/><circle cx="495" cy="142" r="5" fill="#ad7056" stroke="none"/><circle cx="509" cy="142" r="5" fill="#f8f5ed" stroke="#514b40"/><circle cx="658" cy="142" r="27" fill="#f8f5ed" stroke="#514b40"/><circle cx="651" cy="142" r="5" fill="#ad7056" stroke="none"/><circle cx="665" cy="142" r="5" fill="#f8f5ed" stroke="#514b40"/><text x="52" y="260" fill="#655f55" stroke="none" font-size="25" text-anchor="start">Few-shot</text><path d="M294 252 L748 252" stroke="#bdb3a1" marker-end="url(#arrow)"/><circle cx="346" cy="252" r="27" fill="#f8f5ed" stroke="#514b40"/><circle cx="346" cy="252" r="5" fill="#ad7056" stroke="none"/><circle cx="502" cy="252" r="27" fill="#f8f5ed" stroke="#514b40"/><circle cx="502" cy="252" r="5" fill="#ad7056" stroke="none"/><circle cx="658" cy="252" r="27" fill="#f8f5ed" stroke="#514b40"/><circle cx="658" cy="252" r="5" fill="#ad7056" stroke="none"/><text x="52" y="370" fill="#655f55" stroke="none" font-size="25" text-anchor="start">Self-supervised</text><path d="M294 362 L748 362" stroke="#bdb3a1" marker-end="url(#arrow)"/><circle cx="346" cy="362" r="27" fill="#f8f5ed" stroke="#514b40"/><path d="M333 363 Q346 340 359 363" stroke="#7b8873" fill="none" /><path d="M333 363 Q346 384 359 363" stroke="#7b8873" fill="none" /><circle cx="346" cy="362" r="3" fill="#7b8873" stroke="none"/><circle cx="502" cy="362" r="27" fill="#f8f5ed" stroke="#514b40"/><path d="M489 363 Q502 340 515 363" stroke="#7b8873" fill="none" /><path d="M489 363 Q502 384 515 363" stroke="#7b8873" fill="none" /><circle cx="502" cy="362" r="3" fill="#7b8873" stroke="none"/><circle cx="658" cy="362" r="27" fill="#f8f5ed" stroke="#514b40"/><path d="M645 363 Q658 340 671 363" stroke="#7b8873" fill="none" /><path d="M645 363 Q658 384 671 363" stroke="#7b8873" fill="none" /><circle cx="658" cy="362" r="3" fill="#7b8873" stroke="none"/><text x="346" y="77" fill="#655f55" stroke="none" font-size="26" text-anchor="middle">Past</text><text x="502" y="77" fill="#655f55" stroke="none" font-size="26" text-anchor="middle">Present</text><text x="658" y="77" fill="#655f55" stroke="none" font-size="26" text-anchor="middle">Next</text><text x="400" y="448" fill="#655f55" stroke="none" font-size="26" text-anchor="middle">Learning over time, with fewer labels</text></g>
</svg>
