<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Evaluating the meaning of image captions</title>
<desc id="desc">A minimal scene of a person in a boat is paired with a reference caption and a differently worded candidate caption. Correspondence lines illustrate semantic comparison, inspired by Word Mover’s Distance, without assigning invented scores.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#514b40" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="500" fill="#eee8dc"/>
<g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><rect x="54" y="153" width="174" height="167" rx="12" fill="#f8f5ed" stroke="#514b40" /><path d="M74 282 Q104 274 135 282 T209 282" stroke="#7b8873" fill="none" /><path d="M93 253 L190 253 L172 274 L111 274 Z" stroke="#514b40" fill="#dce0d4" /><circle cx="143" cy="211" r="10" fill="#f8f5ed" stroke="#514b40"/><path d="M143 223 L143 251 M143 233 L172 245" stroke="#514b40" fill="none" /><text x="141" y="374" fill="#655f55" stroke="none" font-size="28" text-anchor="middle">Image</text><path d="M245 236 L292 236" stroke="#514b40" marker-end="url(#arrow)"/><rect x="314" y="107" width="430" height="89" rx="9" fill="#f8f5ed" stroke="#514b40" /><rect x="314" y="271" width="430" height="89" rx="9" fill="#f8f5ed" stroke="#514b40" /><text x="529" y="143" fill="#514b40" stroke="none" font-size="27" text-anchor="middle">A person in a boat</text><text x="529" y="179" fill="#655f55" stroke="none" font-size="20" text-anchor="middle">Reference</text><text x="529" y="307" fill="#514b40" stroke="none" font-size="27" text-anchor="middle">Someone on the water</text><text x="529" y="343" fill="#655f55" stroke="none" font-size="20" text-anchor="middle">Candidate</text><path d="M401 210 C401 235 390 235 390 257" stroke="#7b8873" fill="none" /><circle cx="401" cy="209" r="4" fill="#7b8873" stroke="none"/><circle cx="390" cy="258" r="4" fill="#7b8873" stroke="none"/><path d="M527 210 C527 235 539 235 539 257" stroke="#7b8873" fill="none" /><circle cx="527" cy="209" r="4" fill="#7b8873" stroke="none"/><circle cx="539" cy="258" r="4" fill="#7b8873" stroke="none"/><path d="M663 210 C663 235 654 235 654 257" stroke="#7b8873" fill="none" /><circle cx="663" cy="209" r="4" fill="#7b8873" stroke="none"/><circle cx="654" cy="258" r="4" fill="#7b8873" stroke="none"/><text x="529" y="422" fill="#655f55" stroke="none" font-size="28" text-anchor="middle">Compare meaning</text></g>
</svg>
